<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="在 Delib 內參與 Agora Citizen Network 公開對話。" />
    <title>Agora 工作區 · Delib 審議拼圖</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/integrations/agora.js"></script>
  </head>
  <body class="workspace-body">
    <a class="skip-link" href="#workspace-main">跳到對話</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/" aria-label="回 Delib 審議拼圖">
          <span class="brand-mark" aria-hidden="true">⿻</span>
          <span><strong>Delib</strong><span class="brand-divider">·</span>Agora 工作區</span>
        </a>
        <a class="button button-small button-ghost" href="/#launch-agora-citizen-network">回到工具設定</a>
      </div>
    </header>

    <main id="workspace-main" class="workspace-main">
      <div class="wrap workspace-wrap">
        <div class="workspace-heading">
          <div>
            <p class="section-kicker">Embedded public conversation</p>
            <h1>Agora Citizen Network 對話</h1>
            <p id="agora-workspace-status" class="section-lede" role="status">正在載入公開對話。</p>
          </div>
          <a id="agora-direct-link" class="button button-ghost" href="https://www.agoracitizen.app/" target="_blank" rel="noreferrer">改在 Agora 開啟 ↗</a>
        </div>

        <div class="workspace-trust">
          <strong>資料邊界</strong>
          <span>登入、意見、比較與投票直接由 Agora 接收；Delib 不會看到或複製參與資料。</span>
          <span>公開嵌入只代表可以參與，不代表 Delib 已取得建立、管理或匯出權限。</span>
        </div>

        <section id="agora-embed-root" class="external-embed-shell" aria-label="Agora Citizen Network 對話">
          <div class="workspace-loading" aria-hidden="true"></div>
        </section>

        <p class="source-note">
          Agora Citizen Network 是 ZKorum 的 AGPL-3.0 開源專案。若內嵌畫面被瀏覽器或網路阻擋，可以使用上方按鈕直接開啟。
          <a href="https://github.com/zkorum/agora" target="_blank" rel="noreferrer">查看 Agora 原始碼 ↗</a>
        </p>
      </div>
    </main>
  </body>
</html>
