<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="在 Delib 內開啟 Pol.is 審議對話。" />
    <title>Pol.is 工作區 · Delib 審議拼圖</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/integrations/polis.js"></script>
  </head>
  <body class="workspace-body">
    <a class="skip-link" href="#workspace-main">跳到對話</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/" aria-label="回 Delib 審議拼圖">
          <span class="brand-mark" aria-hidden="true">⿻</span>
          <span><strong>Delib</strong><span class="brand-divider">·</span>Pol.is 工作區</span>
        </a>
        <a class="button button-small button-ghost" href="/#launch-polis">回到工具設定</a>
      </div>
    </header>

    <main id="workspace-main" class="workspace-main">
      <div class="wrap workspace-wrap">
        <div class="workspace-heading">
          <div>
            <p class="section-kicker">Embedded deliberation room</p>
            <h1 id="polis-workspace-title">Pol.is 對話</h1>
            <p id="polis-workspace-status" class="section-lede" role="status">正在準備對話，大概幾秒鐘。</p>
          </div>
          <a id="polis-direct-link" class="button button-ghost" href="https://pol.is/" target="_blank" rel="noreferrer">改在 Pol.is 開啟 ↗</a>
        </div>

        <div class="workspace-trust">
          <strong>資料邊界</strong>
          <span>這個畫面由 Pol.is 提供；投票、陳述、管理與刪除都依 Pol.is 的政策。</span>
          <span>Delib 不複製對話資料，也不把 Site ID 當成密碼。</span>
        </div>

        <section id="polis-embed-root" class="polis-embed-shell" aria-label="Pol.is 對話">
          <div class="workspace-loading" aria-hidden="true"></div>
        </section>

        <p class="source-note">
          Pol.is 是獨立的開源專案。若嵌入畫面被瀏覽器或網路阻擋，可以使用上方按鈕直接開啟。
          <a href="https://github.com/compdemocracy/polis" target="_blank" rel="noreferrer">查看 Pol.is 原始碼 ↗</a>
        </p>
      </div>
    </main>
  </body>
</html>
