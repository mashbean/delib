name: Interoperability feedback
description: Report a schema gap, integration failure, deployment friction, or closed-loop usability problem. Field ids match delib-feedback/v1 so /feedback can prefill them.
title: "[Interop] "
labels: ["interop-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include participant content, personal data, pseudonymous participant IDs, API keys, admin tokens, or private URLs.
        The privacy-safe builder at https://delib.mashbean.net/feedback fills this form for you.
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options: [organizer, participant, developer, operator, researcher]
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Flow phase
      options: [recommendation, deployment, participation, import, export, analysis, result, handoff, agent, accessibility]
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Problem category
      options: [schema-gap, integration-failure, deployment-friction, privacy-boundary, accessibility, usability, outcome-loop, other]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [blocked, degraded, confusing, idea]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or integration
      placeholder: Pocket Polis to TTTC
  - type: input
    id: summary
    attributes:
      label: One-line summary
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Privacy-safe reproduction
      description: Use fictional data, a public demo, or field names only.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (optional)
  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      placeholder: Safari 20, Cloudflare Workers Free plan
  - type: input
    id: public_url
    attributes:
      label: Public result URL (optional, no "#" fragment)
  - type: checkboxes
    id: boundary
    attributes:
      label: Data boundary
      options:
        - label: I removed participant content, identifiers, credentials, and private URL fragments.
          required: true
